<script>
// Lash the header cat's tail on hover. The tail is a chain of short joints; a bending wave
// runs from the base to the tip while the base lifts and drops, so the tail sweeps and
// whips across the floor instead of turning as one stiff piece.
(function () {
  var link = document.querySelector(".masthead__right-link");
  var paths = link ? link.querySelectorAll(".cat-icon__tail path") : [];
  if (paths.length !== 2 || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var BASE_X = -46, BASE_Y = 1.5, SEG = 4.3, FLOOR = 2.5, PERIOD = 800;
  // resting elevation of each joint above the floor, in degrees (matches the SVG)
  var REST = [-2, 0, 0, 1, 6, 20, 45, 70];
  var N = REST.length, rest = paths[0].getAttribute("d"), raf = 0, start = 0;
  function shape(t) {
    var phi = 2 * Math.PI * t;
    var lift = 32 * (0.5 - 0.5 * Math.cos(phi));          // base raises the tail off the floor and drops it
    var x = BASE_X, y = BASE_Y, d = "M" + x + " " + y;
    for (var i = 0; i < N; i++) {
      var k = i / (N - 1);
      // the bend travels toward the tip and grows along the tail: a whip
      var e = REST[i] * 0.6 + lift * (1 - 0.4 * k) + 38 * k * Math.sin(phi - 0.9 * i);
      var r = e * Math.PI / 180;
      x -= SEG * Math.cos(r);
      y = Math.min(FLOOR, y - SEG * Math.sin(r));          // it sweeps along the floor, never through it
      d += " L" + x.toFixed(1) + " " + y.toFixed(1);
    }
    return d;
  }
  function frame(now) {
    var d = shape((now - start) / PERIOD);
    paths[0].setAttribute("d", d); paths[1].setAttribute("d", d);
    raf = requestAnimationFrame(frame);
  }
  function begin() { if (raf) return; start = performance.now(); raf = requestAnimationFrame(frame); }
  function end() { cancelAnimationFrame(raf); raf = 0; paths[0].setAttribute("d", rest); paths[1].setAttribute("d", rest); }
  link.addEventListener("mouseenter", begin);
  link.addEventListener("mouseleave", end);
  link.addEventListener("focus", begin);
  link.addEventListener("blur", end);
})();
</script>
